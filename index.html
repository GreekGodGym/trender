<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Журнал подходов</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Журнал">
<link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;700&family=Fira+Sans:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-column phone app. Sticky top bar, bottom tab bar, cards only for exercises.
   Week colours are the olympic plate colours Rushat already uses: red / green / yellow / blue. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#F5F6F8; --ink:#15181C; --ink-2:#48505A; --muted:#78818C;
  --line:#D7DBE0; --line-2:#E7EAED; --accent:#1F5FBF; --accent-soft:#DCE6F6; --btn:#15181C; --on-btn:#FFFFFF;
  --red:#D2262C; --green:#23914A; --yellow:#E6B400; --blue:#1F5FBF; --good:#1D8644; --good-soft:#DDF1E4;
  --warn-soft:#FBEFD0; --band:#E1E5EA; --band-2:#EBEEF1;
  --font-display:"Fira Sans Extra Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Fira Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1013; --surface:#171A1E; --surface-2:#1D2126; --ink:#ECEFF2; --ink-2:#B8C0C9; --muted:#8B949E;
  --line:#2B3037; --line-2:#22262B; --accent:#6F9DF0; --accent-soft:#1D2A40; --btn:#ECEFF2; --on-btn:#0E1013;
  --red:#E5484D; --green:#3BAF68; --yellow:#F1C84B; --blue:#5C8FE6; --good:#4BBA78; --good-soft:#173324;
  --warn-soft:#3A3016; --band:#1B1F24; --band-2:#15181C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#171A1E; --surface-2:#1D2126; --ink:#ECEFF2; --ink-2:#B8C0C9; --muted:#8B949E;
  --line:#2B3037; --line-2:#22262B; --accent:#6F9DF0; --accent-soft:#1D2A40; --btn:#ECEFF2; --on-btn:#0E1013;
  --red:#E5484D; --green:#3BAF68; --yellow:#F1C84B; --blue:#5C8FE6; --good:#4BBA78; --good-soft:#173324;
  --warn-soft:#3A3016; --band:#1B1F24; --band-2:#15181C; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,input[inputmode]{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line-2)}
.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.01em}
.top-meta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main.wrap{padding-block:14px calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--font-display);font-weight:700;font-size:24px;margin:0;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* buttons */
.btn{appearance:none;border:0;border-radius:10px;background:var(--btn);color:var(--on-btn);font-weight:600;padding:12px 16px;min-height:46px;cursor:pointer}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:var(--surface-2);color:var(--ink);font-weight:500}
.btn.danger{background:var(--red);color:#fff}
.link{appearance:none;background:none;border:0;padding:6px 2px;color:var(--accent);font-weight:500;cursor:pointer}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;min-height:36px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
/* plate */
.plate{--pc:var(--muted);width:26px;height:26px;border-radius:50%;border:7px solid var(--pc);background:var(--surface);flex:none;position:relative}
.plate::after{content:"";position:absolute;inset:2px;border-radius:50%;border:1.5px solid var(--pc);opacity:.35}
.plate.sm{width:16px;height:16px;border-width:4px}.plate.sm::after{display:none}
.wk0{--pc:var(--red)}.wk1{--pc:var(--green)}.wk2{--pc:var(--yellow)}.wk3{--pc:var(--blue)}
/* starter */
.panel{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.weeks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.weekbtn{appearance:none;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;cursor:pointer;text-align:left;min-height:56px}
.weekbtn b{display:block;font-weight:600}.weekbtn span{font-size:13px;color:var(--muted)}
.weekbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.daybtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;cursor:pointer;min-height:56px}
.daybtn b{font-family:var(--font-display);font-size:18px;font-weight:700;display:block}
.daybtn span{font-size:13px;color:var(--ink-2)}
.daybtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.field{min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;min-height:46px;font-size:16px;color:var(--ink);width:100%;min-width:0;max-width:100%;display:block}
.field input{height:46px}
input[type="date"]{-webkit-appearance:none;appearance:none;text-align:left;line-height:24px}
input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type="date"]::-webkit-calendar-picker-indicator{margin:0}
.planlist{display:flex;flex-direction:column;gap:2px}
.planlist .pg{font-family:var(--font-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted);margin-top:8px}
.planlist .pi{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line-2)}
.planlist .pi span:last-child{color:var(--ink-2);white-space:nowrap}
/* session */
.sess-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);z-index:10;background:var(--bg);margin:-14px 0 0;padding:10px 0 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-2)}
.sess-head .t{flex:1;min-width:0}
.back{appearance:none;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0 0 2px}
.sess-head .t b{font-family:var(--font-display);font-size:20px;font-weight:700;display:block;line-height:1.1}
.sess-head .t span{font-size:13px;color:var(--muted)}
.prog{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;white-space:nowrap}
.bar{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:2px}
.grp{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex-h .nm{font-weight:600;font-size:16px;min-width:0}
.spec{display:inline-block;margin-top:2px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.spec .star{color:var(--blue);font-weight:600}
.cnt{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cnt.done{color:var(--good);font-weight:600}
.last{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.last .wu{color:var(--muted)}
.last .note{color:var(--muted);font-style:italic}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:20px minmax(0,1fr) 14px minmax(0,0.8fr) auto 34px;gap:6px;align-items:center}
.set .i{color:var(--muted);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.set input{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 8px;min-height:42px;font-size:17px;text-align:center}
.set input::placeholder{color:var(--muted);opacity:.8}
.set.is-done input{border-color:var(--ink-2)}
.set .x{color:var(--muted);text-align:center}
.tag{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-height:36px;font-size:13px;cursor:pointer;min-width:58px}
.tag.work{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.del{appearance:none;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;min-height:36px;cursor:pointer}
.rec{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--good);background:var(--good-soft);border-radius:6px;padding:2px 6px;margin-left:26px;width:max-content}
.ex-actions{display:flex;flex-wrap:wrap;gap:4px 14px}
.ex textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 10px;min-height:60px;font-size:15px;resize:vertical}
.notice{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--warn-soft);color:var(--ink)}
.notice.ok{background:var(--good-soft)}
.confirm{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:var(--r);padding:12px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{appearance:none;border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);cursor:pointer;min-height:56px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
/* progress */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--ink-2)}
.stat .v.up{color:var(--good)}
.card{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;touch-action:pan-y}
.chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--btn);color:var(--on-btn);border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.35;max-width:220px;z-index:2;transform:translateX(-50%);white-space:normal}
.tip[hidden]{display:none!important}
.legend{font-size:12px;color:var(--muted)}
.sesslist{display:flex;flex-direction:column}
.sesslist .r{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line-2);font-size:14px}
.sesslist .r .d{color:var(--muted);font-variant-numeric:tabular-nums}
.sesslist .wu{color:var(--muted)}
.sesslist .other{font-size:12px;color:var(--muted)}
.groups{display:flex;flex-wrap:wrap;gap:6px}
.groups .chip{flex:none}
.bwform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.bwform>*{min-width:0}
.bwform .btn{height:46px;min-height:46px;padding-block:0}
/* history */
.month{font-family:var(--font-display);font-weight:700;font-size:18px;margin-top:6px}
.hlist{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.hrow{appearance:none;border:0;background:none;text-align:left;width:100%;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line-2);cursor:pointer}
.hrow:first-child{border-top:0}
.hrow .d{font-variant-numeric:tabular-nums;font-weight:600}
.hrow .d small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.hrow .l{min-width:0}
.hrow .l b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .l span{font-size:13px;color:var(--muted)}
.hdet{padding:2px 14px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hdet .e b{font-weight:500}
.hdet .e .s{color:var(--ink-2);font-variant-numeric:tabular-nums}
.hdet .e .s .wu{color:var(--muted)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:85vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:10px}
.sheet .list{overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.sheet .opt{appearance:none;border:0;background:var(--surface);text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer}
.sheet .gh{font-family:var(--font-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted);margin:8px 0 2px}
/* ---- v2: coach, chips, warm-ups, ceiling hit, timer, animations ---- */
.ex{box-shadow:inset 4px 0 0 var(--pc,transparent)}
.last{gap:5px}
.last .lrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.last .lt{color:var(--muted);margin-right:2px}
.ch{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:1px 7px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.ch.dr{border-style:dashed}
.last .wu{font-size:12px}
.coach{padding:3px 0 3px 9px;border-left:3px solid var(--pc,var(--accent));font-size:13.5px;line-height:1.35;color:var(--ink)}
.ph{color:var(--muted)}
.set.is-wu input{min-height:38px;font-size:15px;background:var(--surface-2);border-color:var(--line-2);color:var(--ink-2)}
.set.is-wu .i,.set.is-wu .x{opacity:.7}
.set input.hit{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.rec{font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--good);background:var(--good-soft);border-radius:6px;padding:3px 8px;margin-left:26px;width:max-content;max-width:calc(100% - 26px)}
.rec b{font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.ex.flash{animation:fx-flash 1.1s ease-out}
@keyframes fx-flash{0%{box-shadow:inset 4px 0 0 var(--pc),0 0 0 0 var(--pc)}30%{box-shadow:inset 4px 0 0 var(--pc),0 0 0 4px var(--pc)}100%{box-shadow:inset 4px 0 0 var(--pc),0 0 0 0 transparent}}
.opt-row{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px}
.opt-row input{width:22px;height:22px;accent-color:var(--ink)}
/* rest timer */
.rest{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:8px;background:var(--btn);color:var(--on-btn);border-radius:999px;padding:5px 5px 5px 14px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.22)}
.rest b{font-size:16px;min-width:38px;font-variant-numeric:tabular-nums}
.rest button{appearance:none;border:1px solid currentColor;background:none;color:inherit;opacity:.7;width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1;padding:0}
.rest.ready{background:var(--good);color:#fff}
/* ceiling animation */
.fx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;padding:16px}
.fx-in{background:var(--surface);border-radius:20px;padding:14px 22px 16px;box-shadow:0 12px 44px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:232px;max-width:320px;animation:fx-in .28s cubic-bezier(.2,.9,.3,1.2) both,fx-out .4s ease-in 2.3s forwards}
.fx-card{display:flex;flex-direction:column;gap:1px}
.fx-card small{color:var(--muted);font-size:13px}
.fx-card b{font-family:var(--font-display);font-size:26px;line-height:1.1;color:var(--ink)}
.fx-card span{color:var(--ink-2);font-size:14px}
.fx-stage{position:relative;width:200px;height:100px;display:grid;place-items:center}
.fx.rm .fx-stage{display:none}
.fx.rm .fx-in{animation:fx-fade .2s both,fx-out .3s ease-in 2.3s forwards}
@keyframes fx-in{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
@keyframes fx-out{to{opacity:0;transform:translateY(-6px)}}
@keyframes fx-fade{from{opacity:0}to{opacity:1}}
.sc{position:relative;width:200px;height:100px}
.sc-plate .bar{position:absolute;left:8px;right:8px;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--line);animation:fx-bar .5s ease-out .75s}
.sc-plate .pl{position:absolute;top:50%;left:62%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;border:15px solid var(--fxc);background:var(--surface);box-sizing:border-box;animation:fx-plate .85s cubic-bezier(.2,.9,.3,1.25) both}
.sc-plate .pl::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--line)}
@keyframes fx-plate{from{transform:translateX(-170px) rotate(-420deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fx-bar{30%{transform:scaleY(1.9)}60%{transform:scaleY(.8)}}
.sc-odo{display:flex;align-items:center;justify-content:center;gap:8px}
.sc-odo .win{height:56px;overflow:hidden}
.sc-odo .col{animation:fx-odo .8s cubic-bezier(.7,0,.2,1) .35s both}
.sc-odo .col b{display:block;height:56px;line-height:56px;font-family:var(--font-display);font-size:46px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.sc-odo .col b+b{color:var(--good)}
.sc-odo span{font-size:18px;color:var(--muted);align-self:flex-end;padding-bottom:12px}
@keyframes fx-odo{to{transform:translateY(-56px)}}
.sc-crack .ln{position:absolute;top:22px;height:4px;border-radius:2px;background:var(--ink-2)}
.sc-crack .l1{left:6px;width:calc(50% - 6px);transform-origin:right center;animation:fx-l1 .5s ease-in .7s forwards}
.sc-crack .l2{right:6px;width:calc(50% - 6px);transform-origin:left center;animation:fx-l2 .5s ease-in .7s forwards}
.sc-crack .cap{position:absolute;left:6px;top:2px;font-size:12px;color:var(--muted)}

/* ---------- body weight ---------- */
function bwAt(d){
  const pts=S.bw.slice().sort((a,b)=>a[0]<b[0]?-1:1);if(!pts.length)return 75;
  if(d<=pts[0][0])return pts[0][1];if(d>=pts[pts.length-1][0])return pts[pts.length-1][1];
  for(let i=1;i<pts.length;i++){if(d<=pts[i][0]){const a=toDate(pts[i-1][0]),b=toDate(pts[i][0]),c=toDate(d);const k=(c-a)/Math.max(1,b-a);return pts[i-1][1]+(pts[i][1]-pts[i-1][1])*k;}}
  return pts[pts.length-1][1];
}

  if(IDX)return IDX;

  for(const w of ws)for(const e of w.ex){const sets=e.sets.filter(s=>s.r>0);if(!sets.length)continue;(byEx[e.id]=byEx[e.id]||[]).push({w,e,sets});}
  return IDX={ws,byEx};
}
function eff(id,w,d){const k=exInfo(id).kind;if(k==='bw')return bwAt(d)+(w||0);if(k==='assist')return bwAt(d)-(w||0);return w||0;}

  if(METRIC[id])return METRIC[id];
  const reps=[];for(const en of idx().byEx[id]||[])for(const s of en.sets)if(!(s.f&F.WU))reps.push(s.r);
  reps.sort((a,b)=>a-b);const med=reps.length?reps[Math.floor(reps.length/2)]:10;
  return METRIC[id]=med>12?'w':'e1';
}

function progressionFor(id,plan,exclWid,week){

  }
  const noLight=ents.filter(en=>en.w.week!==3);
  /* каждая неделя считается сама по себе: средняя сравнивается со средней, тяжёлая с тяжёлой */
  const cg=wkGrp(week);let pool=noLight;
  if(cg&&cg!=='l'&&plan&&plan.reps){
    const mine=noLight.filter(en=>en.w.week==null||wkGrp(en.w.week)===cg);
    if(mine.length)pool=mine;
    else if(noLight.length){
      const o=noLight[noLight.length-1];const x=estFrom(id,o,plan);
      if(x)return{state:'est',w:x.w,base:null,est:x,exp:expectReps(id,x.e1,x.w),from:x.src};
    }
  }
  const same=plan&&plan.reps?pool.filter(en=>en.e.plan&&en.e.plan.reps===plan.reps):[];
  const src=same.length?same:(pool.length?pool:ents);
  let last=src[src.length-1];
  const rangePlan=last.e.plan&&last.e.plan.reps?last.e.plan:plan;
  const rows=last.sets.filter(s=>!(s.f&F.WU)&&!(s.f&F.DROP)).length;
  let ev=evalSets(id,last.sets,rangePlan,rows);
  if(!ev){
    const ws=last.sets.filter(s=>s.w!=null);
    const w0=ws.length?(kind==='assist'?Math.min(...ws.map(s=>s.w)):Math.max(...ws.map(s=>s.w))):null;
    return{state:'hold',w:w0,base:w0};
  }
  const prevE=src[src.length-2];let evP=null;
  if(prevE){
    const rp=prevE.e.plan&&prevE.e.plan.reps?prevE.e.plan:plan;
    const rowsP=prevE.sets.filter(s=>!(s.f&F.WU)&&!(s.f&F.DROP)).length;
    evP=evalSets(id,prevE.sets,rp,rowsP);
    if(evP&&evP.w===ev.w&&evP.avg>ev.avg){ev=evP;last=prevE;}
  }
  let state='hold',w=ev.w;
  if(ev.reached){state='up';w=bumpW(id,ev.w);}
  else if(ev.low)state='low';
  /* сильно ниже диапазона (на два повтора и больше, или два раза подряд): предлагаем легче на 1–2 шага */
  if(state==='low'&&ev.rg&&(kind==='assist'||ev.w>0)){
    const sev=ev.avg<=ev.rg.lo-2||(evP&&evP.w===ev.w&&evP.low&&prevE!==last);
    if(sev){
      const st=stepFor(id);const x=estFrom(id,last,rangePlan);
      let k=x?Math.round(Math.abs(ev.w-x.w)/st):1;k=Math.max(1,Math.min(2,k));
      const nw=kind==='assist'?Math.round((ev.w+st*k)*100)/100:Math.max(0,Math.round((ev.w-st*k)*100)/100);
      const b=e1Of(id,last);
      return{state:'drop',w:nw,base:ev.w,ev,last,exp:b?expectReps(id,b.v,nw):null};
    }
  }
  if(state==='hold'){
    const tail=src.slice(-3);
    if(tail.length===3){
      const evs=tail.map(en=>evalSets(id,en.sets,rangePlan,null));
      if(evs.every(x=>x&&x.w===ev.w)&&Math.max(evs[1].avg,evs[2].avg)<=evs[0].avg)state='stall';
    }
  }
  /* средняя неделя подтягивается за тяжёлой: если тяжёлая после последней средней даёт больший вес, берём его */
  if(cg==='m'&&plan&&plan.reps&&state!=='stall'){
    const hv=noLight.filter(en=>wkGrp(en.w.week)==='h'&&en.w.d>last.w.d);
    if(hv.length){
      const x=estFrom(id,hv[hv.length-1],plan);
      if(x&&(kind==='assist'?x.w<w-1e-9:x.w>w+1e-9)){
        const st=stepFor(id);const nw=Math.round((kind==='assist'?Math.max(x.w,w-2*st):Math.min(x.w,w+2*st))*100)/100;
        return{state:'link',w:nw,base:ev.w,ev,last,est:x,exp:expectReps(id,x.e1,nw),from:x.src};
      }
    }
  }
  return{state,w,base:ev.w,ev,last};
}
function suggestWork(id,plan,exclWid,week){return progressionFor(id,plan,exclWid,week).w;}

/* разминка: вес в долях рабочего и короткие повторы, чтобы не уставать */
const WU_FR={1:[[.6,5]],2:[[.5,6],[.75,3]],3:[[.4,8],[.6,4],[.8,2]]};
function warmupSpec(id,workW,k){
  if(k<=0)return[];const kind=exInfo(id).kind;
  const tbl=WU_FR[k]||Array.from({length:k},(_,i)=>[.4+.45*i/(k-1),Math.max(2,8-2*i)]);
  const st=stepFor(id);
  return tbl.map(([f,h])=>{
    if(kind==='bw')return{w:workW>0?roundTo(workW*f,st):0,h};
    if(workW==null||kind==='assist')return{w:null,h};
    return{w:roundTo(workW*f,st),h};
  });
}
function buildRows(ex,wid,week){
  const p=ex.plan;const n=p.n||3;const work=p.star?n:Math.min(p.work||n,n);const wu=n-work;
  const ww=suggestWork(ex.id,p,wid,week);const wws=warmupSpec(ex.id,ww,wu);
  ex.sets=[];for(let i=0;i<n;i++)ex.sets.push(i<wu?{w:wws[i].w,r:null,f:F.WU,h:wws[i].h}:{w:ww,r:null,f:0});
}
function startWorkout(week,day,d){
  const plan=(planOf()[week]||[]).find(x=>x.n===day);const w={id:'a-'+Date.now(),d,src:'a',week,day,label:WEEKS[week].name+' неделя · Тренировка '+day,done:false,ex:[]};
  if(plan)for(const b of plan.blocks)for(const it of b.items){const ex={id:it.id,g:b.g,plan:{n:it.n||3,reps:it.reps||'',work:it.work||it.n||3,star:!!it.star},sets:[]};buildRows(ex,w.id,week);w.ex.push(ex);}
  if(plan)for(const b of plan.blocks)for(const it of b.items)delete it.chg;
  S.workouts.push(w);touch();
}

function coachLine(w,e,ei,prog){
  const st=w.week===3?'light':prog.state;const arr=COACH[st];if(!arr)return '';
  const kind=exInfo(e.id).kind;const wt=x=>x==null?'':(kind==='bw'&&x>0?'+':'')+fmtN(x);
  const rg=planRange(e.plan&&e.plan.reps);
  const reps=prog.ev?prog.ev.reps:[];const rp=reps.length&&reps.every(x=>x===reps[0])?String(reps[0]):reps.join('/');
  const rng=e.plan&&e.plan.reps?String(e.plan.reps).replace('-','–')+' повторов':'комфортные повторы';
  return pick(arr,w.id+'|'+e.id+'|'+ei+'|'+st)
    .replace(/\{вес\}/g,wt(prog.base!=null?prog.base:prog.w))
    .replace(/\{новый\}/g,wt(prog.w))

  const el=$('#rest');if(!el)return;

  const left=Math.ceil((REST.end-Date.now())/1000);
  if(left<-5){REST=null;el.hidden=true;setTiming(false);clearInterval(restI);return;}
  el.hidden=false;setTiming(true);
  const t=$('#rest-t'),l=$('#rest-l');

}

function fxScene(k,o,n,dl,rg){

  host.innerHTML=`<div class="fx-in"><div class="fx-stage">${rm?'':fxScene(k,wt(ev.w),wt(nw),dl,ev.rg)}</div><div class="fx-card"><small>${esc(exName(e.id))}</small><b>Потолок взят</b><span>В следующий раз ${wt(nw)} кг${kind==='assist'?' (противовес)':''}</span></div></div>`;

function niceStep(range,target){const raw=range/target;const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,2.5,5,10])if(m*p>=raw)return m*p;return 10*p;}

  for(let v=0;v<=y1+1e-9;v+=st){const y=Y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v}</text>`;}
  bars.forEach((b,i)=>{const x=L+i*bw+1,w=Math.max(2,bw-2),y=Y(b.v),h=H-B-y;
    if(b.v>0){const r=Math.min(4,w/2,h);s+=`<path d="M${x} ${H-B}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${H-B}Z" fill="${b.cur?'var(--ink)':'var(--accent)'}"/>`;}
    if(i%4===0)s+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${fmtD(b.k).replace(' ',' ')}</text>`;});
  s+=`<rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  el.innerHTML=s;const svg=el.querySelector('svg'),tip=el.querySelector('.tip');
  const show=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)*W/r.width;const i=Math.max(0,Math.min(n-1,Math.floor((px-L)/bw)));const b=bars[i];
    tip.innerHTML=`Неделя с ${fmtD(b.k)}<br><b>${b.v}</b> рабочих подходов`;tip.hidden=false;tip.style.left=Math.min(Math.max((L+i*bw+bw/2)*r.width/W,90),r.width-90)+'px';tip.style.top=Math.max(0,Y(b.v)*r.height/H-tip.offsetHeight-10)+'px';};
  svg.addEventListener('pointerdown',show);svg.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)show(e);});
  svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')tip.hidden=true;});
}
function drawCharts(){
  const id=UI.ex,ents=idx().byEx[id];
  if(ents){const pts=[];for(const en of ents){const b=sessionBest(id,en);if(b)pts.push({t:toDate(en.w.d).getTime(),y:b.v,en,b});}
    drawLine($('#ch-ex'),pts,{bands:1,xmax:Date.now(),label:'График '+exName(id),tip:p=>`<b>${fmtD(p.en.w.d)}</b> · ≈${fmtN(Math.round(p.y*10)/10)} кг<br>${p.en.sets.filter(s=>!(s.f&F.WU)).map(s=>fmtSet(id,s)).join(' · ')}`});}
  // weekly volume
  const now=toDate(todayISO());const wk0=weekKey(todayISO());const keys=[];for(let i=15;i>=0;i--){const t=new Date(toDate(wk0).getTime()-i*7*dayMs);keys.push(t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()));}

  drawBars($('#ch-vol'),keys.map(k=>({k,v:cnt[k],cur:k===wk0})),{label:'Рабочие подходы в неделю: '+UI.grp});
  const bw=S.bw.slice().sort((a,b)=>a[0]<b[0]?-1:1).map(([d,v])=>({t:toDate(d).getTime(),y:v,d}));
  drawLine($('#ch-bw'),bw,{h:170,xmax:Date.now(),label:'Вес тела',tip:p=>`<b>${fmtD(p.d)}</b> · ${fmtN(p.y)} кг`});
}

function exportJSON(){return JSON.stringify({app:'zhurnal',v:1,exported:new Date().toISOString(),workouts:S.workouts,bw:S.bw,custom:S.custom,plan:S.plan});}
function markBackup(){S.backupAt=Date.now();S.backupMark=S.workouts.filter(w=>w.src==='a'&&w.done).length;flush();}
async function doExport(){
  const json=exportJSON();const name='zhurnal-'+todayISO()+'.json';
  try{const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Копия журнала'});markBackup();DM.msg={ok:1,t:'Копия передана. Если выбрали «Сохранить в Файлы», она там.'};render();return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();markBackup();DM.msg={ok:1,t:'Файл '+name+' сохранён в загрузки.'};}
  catch(e){DM.msg={t:'Не получилось сохранить файл. Используйте «Скопировать копию как текст».'};}
  render();
}
async function doCopy(){
  const json=exportJSON();
  try{await navigator.clipboard.writeText(json);markBackup();DM.msg={ok:1,t:'Копия скопирована. Вставьте её в Заметки или отправьте себе.'};}
  catch(e){DM.paste=false;DM.msg={t:'Буфер обмена недоступен. Выделите текст ниже и скопируйте вручную.'};render();const ta=document.createElement('textarea');ta.value=json;ta.rows=5;ta.style.width='100%';$('#view').appendChild(ta);ta.select();return;}
  render();
}
function importText(txt){
  let o;try{o=JSON.parse(txt);}catch(e){DM.msg={t:'Это не похоже на копию журнала: файл не читается.'};render();return;}
  if(!o||o.app!=='zhurnal'||!Array.isArray(o.workouts)){DM.msg={t:'В файле нет записей журнала. Нужен файл, сохранённый кнопкой «Сохранить копию».'};render();return;}
  const byId=new Map(S.workouts.map(w=>[w.id,w]));let add=0,upd=0;
  for(const w of o.workouts){if(!w||!w.id||!w.d||!Array.isArray(w.ex))continue;if(byId.has(w.id))upd++;else add++;byId.set(w.id,w);}
  S.workouts=[...byId.values()];
  const bw=new Map(S.bw.map(x=>[x[0],x[1]]));for(const x of o.bw||[])if(Array.isArray(x))bw.set(x[0],x[1]);S.bw=[...bw.entries()];
  Object.assign(S.custom,o.custom||{});let planNote='';if(validPlan(o.plan)){S.plan=o.plan;planNote=' План из копии загружен.';}
  touch();flush();DM.msg={ok:1,t:`Загружено: новых тренировок ${add}, обновлено ${upd}.`+planNote};DM.paste=false;render();
}

/* ---------- plan storage, day labels ---------- */
const clonePlan=p=>JSON.parse(JSON.stringify(p));
const validPlan=p=>Array.isArray(p)&&p.length===4&&p.every(wk=>Array.isArray(wk)&&wk.every(d=>d&&Array.isArray(d.blocks)));
const planOf=()=>validPlan(S.plan)?S.plan:PLAN;
function ensurePlan(){if(!validPlan(S.plan)){S.plan=clonePlan(PLAN);touch();}}
function dayLabel(wk,d){
  const p=(planOf()[wk]||[]).find(x=>x.n===d);
  if(!p)return 'Тренировка '+d;
  return [...new Set(p.blocks.map(b=>b.g))].join(' · ')||('Тренировка '+d);
}

/* ---------- v4: current set, folding finished exercises, hall of fame ---------- */
const isWU=s=>!!(s.f&F.WU);
function isDone(e){const r=e.sets.filter(s=>!isWU(s));return r.length>0&&r.every(s=>s.r>0);}
function pendingIn(e){let last=-1;e.sets.forEach((s,i)=>{if(s.r>0)last=i;});return last+1<e.sets.length?last+1:-1;}
function curSet(w){
  const n=w.ex.length;if(!n)return null;
  let start=(ST.lastW===w.id&&ST.last!=null&&w.ex[ST.last])?ST.last:-1;
  if(start<0){w.ex.forEach((e,i)=>{if(e.sets.some(s=>s.r>0))start=i;});if(start<0)start=0;}
  for(let k=0;k<n;k++){const ei=(start+k)%n;const si=pendingIn(w.ex[ei]);if(si>=0)return{ei,si};}
  return null;
}
function markCurrent(){
  document.querySelectorAll('.set.cur').forEach(el=>el.classList.remove('cur'));
  const w=active();if(!w||UI.tab!=='train'||ED.on)return null;
  const c=curSet(w);if(!c)return null;
  const el=$('#set-'+c.ei+'-'+c.si);if(el)el.classList.add('cur');
  return c;
}
function scrollToRow(el,instant){
  if(!el)return;
  const rm=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  const vv=window.visualViewport;const h=vv?vv.height:window.innerHeight;const off=vv?vv.offsetTop:0;
  const r=el.getBoundingClientRect();
  const d=(r.top+r.height/2)-(off+h*0.42);
  if(Math.abs(d)<24)return;
  window.scrollBy({top:d,behavior:(rm||instant)?'auto':'smooth'});
}
/* keep the chosen element where it was on screen while the layout above it changes */
function withAnchor(sel,fn){
  const a=$(sel);const t0=a?a.getBoundingClientRect().top:null;
  fn();
  const b=t0!=null?$(sel):null;
  if(b){const d=b.getBoundingClientRect().top-t0;if(Math.abs(d)>1)window.scrollBy(0,d);}
}
function refreshCard(w,ei){const el=$('#ex-'+ei);if(el&&w.ex[ei])el.outerHTML=exCard(w,w.ex[ei],ei);}
function foldHTML(w,e,ei,best){

}
let advT=null,foldT=null,foldPending=false;

function foldDone(){

/* ---------- hall of fame ---------- */
const plRu=(n,f)=>{const a=n%100,b=n%10;return a>10&&a<15?f[2]:b===1?f[0]:b>1&&b<5?f[1]:f[2];};
function hofHeavy(id){
  const kind=exInfo(id).kind;let ok=null,any=null;
  for(const en of idx().byEx[id]||[]){
    if(en.e.other)continue;
    for(const s of en.sets){
      if(!countable(s))continue;if(kind==='w'&&!(s.w>0))continue;
      const c={L:eff(id,s.w,en.w.d),s,d:en.w.d};
      const bt=(x,y)=>!y||x.L>y.L+1e-9||(Math.abs(x.L-y.L)<=1e-9&&x.s.r>y.s.r);
      if(s.r>=3&&bt(c,ok))ok=c;
      if(bt(c,any))any=c;
    }
  }
  return ok||any;
}
function hofData(mode){
  const out={};
  Object.keys(idx().byEx).forEach(id=>{
    let r=null;
    if(mode==='f'){const b=bestEver(id,null);if(b)r={s:b.s,d:b.d,v:b.v};}
    else{const b=hofHeavy(id);if(b)r={s:b.s,d:b.d,v:b.L};}
    if(!r)return;const g=exInfo(id).group;(out[g]=out[g]||[]).push(Object.assign({id,name:exName(id)},r));
  });
  Object.keys(out).forEach(g=>out[g].sort((a,b)=>a.name.localeCompare(b.name,'ru')));
  return out;
}

    case 'sheet-bg':if(ev.target===t){PK=null;renderPicker();}break;
    case 'finish':ST.confirm=noWeightList(w).length?'noweight':'finish';render();break;
    case 'cancel':ST.confirm='cancel';render();break;
    case 'confirm-no':ST.confirm=null;render();break;
    case 'finish-yes':{let n=0,rec=0;for(const e of w.ex){const best=bestEver(e.id,w.id);fixBw(e);e.sets=e.sets.filter(s=>s.r>0);n+=e.sets.length;if(best&&e.sets.some(s=>!(s.f&F.WU)&&scoreSet(e.id,s,w.d)>best.v+1e-6))rec++;}
      w.ex=w.ex.filter(e=>e.sets.length);w.done=true;ST.confirm=null;ST.week=null;ST.day=null;ST.date=null;touch();flush();
      ST.flash=finishPhrase(n,rec,w.week,fourthWeek(w));render();window.scrollTo(0,0);break;}
    case 'back':{const n=w.ex.reduce((a,e)=>a+e.sets.filter(z=>z.r>0).length,0);if(n){ST.confirm='back';render();window.scrollTo(0,0);break;}}
    // falls through when nothing entered
    case 'back-yes':{ST.week=w.week;ST.day=w.day;ST.date=w.d;S.workouts=S.workouts.filter(x=>x!==w);ST.confirm=null;ST.flash=null;touch();render();window.scrollTo(0,0);break;}
    case 'cancel-yes':S.workouts=S.workouts.filter(x=>x!==w);ST.confirm=null;touch();render();break;
    case 'grp':UI.grp=v;saveUI();render();break;
    case 'bw-add':{const d=$('#bw-date').value,kg=parseN($('#bw-kg').value);if(!d||!kg||kg<30||kg>250){$('#bw-kg').focus();break;}S.bw=S.bw.filter(x=>x[0]!==d);S.bw.push([d,kg]);touch();render();break;}
    case 'hopen':HO[v]=HO[v]?false:true;render();break;
    case 'hdel':HO[v]='del';render();break;
    case 'hdel-no':HO[v]=true;render();break;
    case 'hdel-yes':S.workouts=S.workouts.filter(x=>x.id!==v);delete HO[v];touch();render();break;
    case 'hedit':{const x=S.workouts.find(z=>z.id===v);if(x){x.done=false;UI.tab='train';touch();render();window.scrollTo(0,0);}break;}
    case 'export':doExport();break;
    case 'copy':doCopy();break;
    case 'show-paste':DM.paste=true;render();break;
    case 'imp-text':importText($('#imp-text').value);break;
    case 'reset':DM.confirmReset=true;render();break;
    case 'reset-no':DM.confirmReset=false;render();break;
    case 'reset-yes':{const keepP=S.plan,keepC=S.custom;S=blank();S.plan=keepP;S.custom=keepC;}touch();flush();DM.confirmReset=false;DM.msg={ok:1,t:'Все записи удалены.'};render();break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;const f=t.dataset&&t.dataset.field;if(!f)return;const w=active();
  if(f==='w'||f==='r'){const ei=+t.dataset.ei,si=+t.dataset.si;const s=w.ex[ei].sets[si];const was=s.r>0;s[f]=parseN(t.value);ST.last=ei;ST.lastW=w.id;touch();updateLive(ei,si);if(f==='r')afterReps(w,ei,si,was);}
  else if(f==='note'){w.ex[+t.dataset.ei].note=t.value;touch();}
  else if(f==='st-date'){ST.date=t.value;}
  else if(f&&f.indexOf('ed-')===0&&f!=='ed-star'){const it=edItem(+t.dataset.b,+t.dataset.i);
    if(it){
      if(f==='ed-n'){const v=parseInt(t.value,10);if(v>0)it.n=v;else delete it.n;}
      else if(f==='ed-reps'){const v=t.value.trim();if(v)it.reps=v;else delete it.reps;}
      else if(f==='ed-work'){const v=parseInt(t.value,10);if(v>0)it.work=v;else delete it.work;}
      it.chg=true;touch();const rw=t.closest('.edrow');if(rw)rw.classList.add('chg');}}
  else if(f==='pk-q'){PK.q=t.value;const pos=t.selectionStart;renderPicker();const q=$('#pk-q');q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}}
});
document.addEventListener('change',ev=>{
  const t=ev.target;const f=t.dataset&&t.dataset.field;
  if(f==='ex-select'){UI.ex=t.value;saveUI();render();}
  if(f==='opt-timer'){UI.timer=t.checked;saveUI();if(!t.checked){REST=null;tickRest();}}
  if(f==='opt-anim'){UI.anim=t.checked;saveUI();}
  if(f==='opt-spicy'){UI.spicy=t.checked;saveUI();}
  if(f==='ed-star'){const it=edItem(+t.dataset.b,+t.dataset.i);if(it){if(t.checked){it.star=1;delete it.work;}else{delete it.star;if(!it.work)it.work=it.n||2;}it.chg=true;touch();render();}}
  if(f==='imp-file'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(t.files[0]);t.value='';}
});
document.addEventListener('focusout',ev=>{const t=ev.target;if(t&&t.closest&&t.closest('.set')&&active())scheduleFold(2500);});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&PK){PK=null;renderPicker();}});
let rsT=null;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(UI.tab==='prog')drawCharts();},150);});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});

try{document.documentElement.lang='ru';}catch(e){}
load();render();
setTimeout(()=>{const w=active();if(w&&UI.tab==='train'&&w.ex.some(e=>e.sets.some(s=>s.r>0))){const c=markCurrent();if(c)scrollToRow($('#set-'+c.ei+'-'+c.si),true);}},300);

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
